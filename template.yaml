AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  AppMetaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: main.lambda_handler
      Runtime: python3.12
      CodeUri: lambdas/app-meta/
      Events:
        Webhook:
          Type: Api
          Properties:
            Path: /webhook
            Method: ANY